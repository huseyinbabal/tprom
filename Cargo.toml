[package]
name = "tprom"
version = "0.1.0"
edition = "2021"
description = "Terminal UI for Prometheus - A modern TUI for monitoring Prometheus servers"
license = "MIT"
repository = "https://github.com/huseyinbabal/tprom"
homepage = "https://github.com/huseyinbabal/tprom"
keywords = ["prometheus", "tui", "terminal", "monitoring", "cli"]
categories = ["command-line-utilities"]
readme = "README.md"
authors = ["Huseyin Babal"]

[dependencies]
anyhow = "1.0"
chrono = "0.4"
clap = { version = "4.6", features = ["derive"] }
crossterm = "0.29"
dirs = "7.0"
ratatui = "0.30"
reqwest = { version = "0.13", features = ["json", "query"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
thiserror = "2.0"
regex = "1.13"
tokio = { version = "1.54", features = ["full"] }
